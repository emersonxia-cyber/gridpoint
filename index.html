<style>
/* Layout: Apple Weather on the Mac — places sidebar on the left, one location's sky on the right;
   on a phone the sidebar becomes a sheet. Sky gradient + translucent cards, white type. */
:root {
  --sky1: #2c6fc0;
  --sky2: #78b4ea;
  --card: rgba(9, 22, 46, 0.24);
  --card-strong: rgba(9, 22, 46, 0.34);
  --card-line: rgba(255, 255, 255, 0.10);
  --hair: rgba(255, 255, 255, 0.16);
  --fg: #ffffff;
  --fg2: rgba(255, 255, 255, 0.72);
  --fg3: rgba(255, 255, 255, 0.50);
  --rain: #6fd0ff;
  --panel: rgba(30, 34, 44, 0.94);
  --sev-extreme: #ff5b4f;
  --sev-moderate: #ff9f43;
  --sev-minor: #ffd166;
  --font: "Helvetica Now Text", "Helvetica Now", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --font-display: "Helvetica Now Display", "Helvetica Now", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --font-micro: "Helvetica Now Micro", "Helvetica Now Text", "Helvetica Now", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --r: 0px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  font: 15px/1.35 var(--font);
  color: var(--fg);
  background: var(--sky1);
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
  overflow-x: hidden;
}
.sky { position: fixed; inset: 0; z-index: -2; background: linear-gradient(180deg, var(--sky1) 0%, var(--sky2) 100%); transition: opacity .6s; }
#fx { position: fixed; inset: 0; z-index: -1; pointer-events: none; width: 100%; height: 100%; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
a { color: inherit; }
:focus-visible { outline: 2px solid rgba(255,255,255,0.9); outline-offset: 2px; }
[hidden] { display: none !important; }

.app { display: grid; grid-template-columns: 312px minmax(0, 1fr); min-height: 100vh; }
.sidebar {
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  padding: max(18px, env(safe-area-inset-top, 0px)) 14px 18px max(14px, env(safe-area-inset-left, 0px));
  background: rgba(6, 14, 30, 0.38);
  -webkit-backdrop-filter: blur(30px) saturate(140%); backdrop-filter: blur(30px) saturate(140%);
  border-right: 1px solid var(--card-line);
  display: flex; flex-direction: column;
}
.main {
  width: 100%; max-width: 1040px; margin: 0 auto;
  padding-block: max(14px, env(safe-area-inset-top, 0px)) max(28px, env(safe-area-inset-bottom, 0px));
  padding-left: max(18px, env(safe-area-inset-left, 0px));
  padding-right: max(18px, env(safe-area-inset-right, 0px));
}
@media (max-width: 880px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .sidebar { display: none; }
  .main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}

/* top bar */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 36px; }
.bar-left, .bar-right { display: flex; align-items: center; gap: 8px; }
.iconbtn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 34px; min-width: 34px; padding: 0 10px; border-radius: 0;
  background: rgba(255,255,255,0.14); color: var(--fg); font-size: 13px; font-weight: 500;
  -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
}
.iconbtn:hover { background: rgba(255,255,255,0.22); }
.iconbtn svg { width: 16px; height: 16px; }
.phone-only { display: none; }
@media (max-width: 880px) { .phone-only { display: inline-flex; } }
.seg { display: inline-flex; background: rgba(255,255,255,0.14); border-radius: 0; padding: 2px; height: 34px; }
.seg button { padding: 0 11px; border-radius: 0; font-size: 13px; font-weight: 500; color: var(--fg2); }
.seg button[aria-pressed="true"] { background: rgba(255,255,255,0.92); color: #1d2f4a; }
.updated { font-size: 12px; color: var(--fg2); min-width: 0; text-align: right; line-height: 1.2; overflow-wrap: break-word; }
.bar-right { min-width: 0; }
/* small phones (iPhone SE, or Display Zoom): tighter bar */
@media (max-width: 359px) {
  .bar, .bar-left, .bar-right { gap: 6px; }
  .seg button { padding: 0 8px; }
  .updated { font-size: 11px; }
}
.spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* hero */
.hero { text-align: center; padding: 18px 0 22px; text-shadow: 0 1px 3px rgba(0,0,0,0.12); }
.hero-place { font: 400 34px/1.15 var(--font-display); letter-spacing: -0.01em; text-wrap: balance; }
.hero-temp { font: 200 104px/1 var(--font-display); margin: 2px 0 2px 0.2em; letter-spacing: -0.045em; }
.hero-cond { font: 500 21px/1.3 var(--font-display); }
.hero-hilo { font: 500 21px/1.3 var(--font-display); margin-top: 2px; }
.hero-src { margin-top: 10px; font-size: 12.5px; color: var(--fg2); }
@media (max-width: 480px) { .hero-temp { font-size: 92px; } .hero-place { font-size: 30px; } }

/* content grid */
.content { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
.stack { display: grid; gap: 12px; align-content: start; min-width: 0; }
@media (min-width: 1240px) {
  .content { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); align-items: start; }
  .span2 { grid-column: 1 / -1; }
}
.card {
  background: var(--card); border: 1px solid var(--card-line); border-radius: var(--r);
  -webkit-backdrop-filter: blur(26px) saturate(150%); backdrop-filter: blur(26px) saturate(150%);
  padding: 11px 14px 13px; min-width: 0;
}
.card-h {
  display: flex; align-items: center; gap: 6px; min-height: 18px;
  font-size: 12px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--fg2);
}
.card-h svg { width: 14px; height: 14px; flex: none; opacity: .9; }
.card-h .right { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 500; }
.card-h .lbl { min-width: 0; overflow-wrap: anywhere; hyphens: auto; }   /* a long one-word label ("Luftfeuchtigkeit") on a small phone */
.rule { height: 1px; background: var(--hair); margin: 9px 0 0; }

/* notices + alerts */
.notice { font-size: 13px; color: var(--fg); background: rgba(0,0,0,0.22); border-radius: 0; padding: 9px 12px; }
.alert { padding: 0; overflow: hidden; }
.alert-btn { display: block; width: 100%; text-align: left; padding: 11px 14px 12px; }
.alert-top { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.alert-top .dotsev { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.alert-title { font-size: 17px; font-weight: 500; margin-top: 5px; }
.alert-sub { font-size: 13px; color: var(--fg2); margin-top: 2px; }
.alert-body { padding: 0 14px 14px; font-size: 14px; white-space: pre-wrap; color: var(--fg); }
.alert-body h4 { margin: 10px 0 4px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--fg2); }
.en-note { margin: 0 0 8px; font-size: 12.5px; color: var(--fg2); white-space: normal; }

/* hourly */
.summary { font-size: 15px; padding-bottom: 9px; border-bottom: 1px solid var(--hair); text-wrap: pretty; }
.hours { display: flex; overflow-x: auto; scroll-snap-type: x proximity; padding: 12px 0 2px; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.25) transparent; }
.hr { flex: 0 0 auto; width: 58px; scroll-snap-align: start; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.hr .t { font-size: 14px; font-weight: 500; white-space: nowrap; }
.hr .ic { height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; }
.hr .ic .wi { width: 30px; height: 30px; }
.hr .p { font-size: 11.5px; font-weight: 700; color: var(--rain); line-height: 1; margin-top: 1px; }
.hr .v { font-size: 19px; font-weight: 500; }
/* the sunrise/sunset word may run a little past its hour's column (the neighbors' numbers are narrow), rather than break mid-word */
.hr.sun .v { font-size: 13px; font-weight: 500; padding-top: 3px; width: max-content; max-width: 76px; text-align: center; line-height: 1.15; }
.hr.nbm .t { color: var(--fg2); }

/* daily */
.days { margin-top: 2px; }
.day {
  display: grid; grid-template-columns: var(--dn, 58px) 40px 42px minmax(60px, 1fr) 42px; align-items: center; gap: 10px;
  width: 100%; text-align: left; padding: 9px 2px; border-top: 1px solid var(--hair); border-radius: 0;
}
.day:first-child { border-top: 0; }
@media (max-width: 359px) {
  .day { gap: 6px; grid-template-columns: var(--dn, 58px) 34px 36px minmax(36px, 1fr) 36px; }
  .day .lo, .day .hi { font-size: 16px; }
}
.day:hover { background: rgba(255,255,255,0.05); }
.day .dn { font-size: 17px; font-weight: 500; }
.day .di { display: flex; flex-direction: column; align-items: center; }
.day .di .wi { width: 28px; height: 28px; }
.day .di .p { font-size: 11.5px; font-weight: 700; color: var(--rain); line-height: 1; margin-top: 1px; }
.day .lo, .day .hi { font-size: 17px; font-weight: 500; text-align: right; font-variant-numeric: tabular-nums; }
.day .lo { color: var(--fg2); }
.day .lo.est { font-style: italic; }
.track { position: relative; height: 5px; border-radius: 0; background: rgba(0,0,0,0.22); }
.track .segm { position: absolute; top: 0; bottom: 0; border-radius: 0; }
.track .now { position: absolute; top: 50%; width: 9px; height: 9px; border-radius: 50%; background: #fff; border: 2px solid rgba(20,30,50,0.55); transform: translate(-50%, -50%); }
.xdiv { display: flex; align-items: center; gap: 8px; padding: 12px 2px 4px; border-top: 1px solid var(--hair); font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--fg2); }
.xdiv .tag, .tag { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .06em; padding: 2px 6px; border-radius: 0; background: rgba(255,255,255,0.18); color: var(--fg); text-transform: uppercase; }
.xnote { font-size: 12.5px; color: var(--fg2); padding: 0 2px 6px; }

/* tiles */
.tiles { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); align-content: start; }
.tile { display: flex; flex-direction: column; min-height: 168px; }
.tile.wide { grid-column: 1 / -1; min-height: 0; }
.tile .big { font: 500 34px/1.05 var(--font-display); letter-spacing: -0.02em; margin-top: 8px; }
.tile .small { font-size: 13.5px; color: var(--fg); margin-top: auto; padding-top: 8px; text-wrap: pretty; overflow-wrap: anywhere; hyphens: auto; }
.tile .muted { color: var(--fg2); }
.moonrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 8px; }
.moonrow > svg { flex: none; }
.moonrow > div { flex: 1 1 0; overflow-wrap: break-word; }   /* beside the disc, or under it when the phase name is a long word */
.moonrow .ph { font-size: 18px; font-weight: 600; line-height: 1.2; }
.tile svg.gauge { display: block; margin: 6px auto 0; width: 100%; max-width: 150px; height: auto; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 13.5px; margin-top: 8px; }
.kv dt { color: var(--fg2); }
.kv dd { margin: 0; text-align: right; font-weight: 500; font-variant-numeric: tabular-nums; }
.windwrap { display: flex; align-items: center; gap: 16px; margin-top: 6px; }
.windwrap svg { width: 104px; height: 104px; flex: none; }
.windwrap .kv { margin-top: 0; min-width: 0; }
.windwrap .kv dt { overflow-wrap: anywhere; hyphens: auto; }
@media (max-width: 359px) {
  .windwrap { gap: 10px; }
  .windwrap svg { width: 88px; height: 88px; }
  .moonrow .ph { font-size: 16px; }
  .dchip .w { font-size: 10.5px; letter-spacing: -0.01em; }
}
.sunrow { display: flex; align-items: center; gap: 14px; margin-top: 4px; }
.sunarc { display: block; flex: 1 1 150px; min-width: 0; max-width: 320px; height: auto; margin-left: auto; }

/* radar + sources */
.radar img { display: block; width: 100%; max-width: 100%; border-radius: 0; margin-top: 10px; background: rgba(0,0,0,0.25); aspect-ratio: 600 / 550; height: auto; object-fit: contain; }
.cap { font-size: 12.5px; color: var(--fg2); margin-top: 8px; }
.sources dl { margin: 10px 0 0; display: grid; gap: 8px; }
.sources dl > div { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 10px; font-size: 13.5px; }
.sources dt { color: var(--fg2); font-weight: 500; }
.sources dd { margin: 0; }
.links { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 12px; font-size: 13.5px; }
.links a { color: var(--fg); text-decoration: underline; text-decoration-color: rgba(255,255,255,.4); text-underline-offset: 3px; }
.afd-body { font-size: 14.5px; line-height: 1.5; }
.afd-body h4 { display: flex; justify-content: space-between; gap: 10px; margin: 12px 0 4px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--fg2); }
.afd-body h4 span { text-transform: none; letter-spacing: 0; font-weight: 500; text-align: right; }
.afd-body p { margin: 0 0 8px; text-wrap: pretty; }
.afd-body ul { margin: 0 0 8px; padding-left: 18px; }
.afd-body li { margin: 0 0 6px; text-wrap: pretty; }
.afd-body li.khead { list-style: none; margin: 10px 0 4px -18px; font-size: 11.5px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--fg2); }
.morebtn { margin-top: 2px; padding-left: 0; text-decoration: underline; text-decoration-color: rgba(255,255,255,.4); text-underline-offset: 3px; }
.foot { text-align: center; font-size: 12px; color: var(--fg2); padding: 18px 0 4px; }

/* sidebar / places */
.sb-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.sb-title { font: 700 22px/1.2 var(--font-display); letter-spacing: -0.01em; }
.textbtn { font-size: 14px; font-weight: 500; color: var(--fg); padding: 4px 6px; border-radius: 0; }
.textbtn:hover { background: rgba(255,255,255,0.1); }
.search { position: relative; }
.search input {
  width: 100%; height: 36px; border-radius: 0; border: 0; padding: 0 12px 0 34px;
  background: rgba(255,255,255,0.14); color: var(--fg); font: 15px var(--font);
}
.search input::placeholder { color: var(--fg2); }
.search > svg { position: absolute; left: 10px; top: 10px; width: 16px; height: 16px; opacity: .75; pointer-events: none; }
/* search results: a plain list under the box, the typed letters in bold (as in Apple Weather) */
.results { margin-top: 8px; background: rgba(10,18,34,0.5); }
.res { display: block; width: 100%; text-align: left; padding: 8px 12px 9px; border-top: 1px solid var(--hair); }
.res:first-child { border-top: 0; }
.res.hl { background: rgba(255,255,255,0.15); }
.res-name { display: block; font-size: 15px; line-height: 1.3; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.res-name b, .res-sub b { font-weight: 700; color: var(--fg); }
.res-sub { display: block; margin-top: 1px; font-size: 12.5px; line-height: 1.3; color: var(--fg2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.results .empty { padding: 12px; color: var(--fg2); font-size: 13.5px; line-height: 1.4; }
.herebtn { display: flex; align-items: center; gap: 8px; width: 100%; margin: 10px 0 4px; padding: 8px 10px; border-radius: 0; font-size: 14px; font-weight: 500; background: rgba(255,255,255,0.08); }
.herebtn svg { width: 15px; height: 15px; }
.plist { display: grid; gap: 10px; margin-top: 10px; }
.pcard {
  position: relative; display: block; width: 100%; text-align: left; border-radius: 0; padding: 11px 13px 12px;
  background: linear-gradient(180deg, var(--c1, #2c6fc0), var(--c2, #78b4ea));
  border: 2px solid transparent; box-shadow: 0 1px 0 rgba(255,255,255,0.06) inset;
}
.pcard.sel { border-color: rgba(255,255,255,0.85); }
.pc-top, .pc-bot { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.pc-name { font-size: 18px; font-weight: 700; }
.pc-time { font-size: 12.5px; font-weight: 500; opacity: .85; }
.pc-temp { font: 300 38px/1 var(--font-display); letter-spacing: -0.03em; }
.pc-bot { margin-top: 12px; align-items: flex-end; font-size: 13px; font-weight: 500; }
.pc-cond { opacity: .9; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pc-hilo { white-space: nowrap; }
.pc-del { position: absolute; top: -7px; right: -7px; width: 26px; height: 26px; border-radius: 0; background: #ff453a; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; box-shadow: 0 2px 6px rgba(0,0,0,.3); }
.sb-foot { margin-top: 16px; font-size: 12px; color: var(--fg2); line-height: 1.45; }

/* sheets */
.sheet {
  position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,0.42);
  padding: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
}
.panel {
  width: min(780px, 100%); max-height: 100%; overflow-y: auto; overscroll-behavior: contain;
  background: var(--panel); border: 1px solid rgba(255,255,255,0.08); border-radius: 0;
  -webkit-backdrop-filter: blur(40px); backdrop-filter: blur(40px);
  padding: 14px 18px 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.45);
}
.places-panel { width: min(460px, 100%); height: 100%; background: rgba(12, 20, 36, 0.96); }
.panel-top { display: flex; align-items: center; gap: 10px; }
.tabs { display: flex; gap: 4px; overflow-x: auto; flex: 1; min-width: 0; scrollbar-width: none; -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 26px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 26px), transparent); }
.tabs::-webkit-scrollbar { display: none; }
.tabs::after { content: ''; flex: 0 0 20px; }
.tabs button { flex: none; padding: 7px 12px; border-radius: 0; font-size: 13.5px; font-weight: 500; color: var(--fg2); background: rgba(255,255,255,0.06); }
.tabs button[aria-selected="true"] { background: rgba(255,255,255,0.92); color: #182437; }
.xbtn { flex: none; width: 32px; height: 32px; border-radius: 0; background: rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center; }
.xbtn svg { width: 14px; height: 14px; }
.dstrip { display: grid; grid-template-columns: repeat(var(--n, 11), minmax(0, 1fr)); gap: 2px; margin-top: 14px; }
.dchip { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px 0; border-radius: 0; }
.dchip .w { font-size: 11.5px; font-weight: 700; color: var(--fg2); }
.dchip .n { width: 100%; max-width: 32px; aspect-ratio: 1; border-radius: 0; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 500; }
.dchip.today .n { color: #64c8ff; }
.dchip[aria-current="true"] .n { background: #fff; color: #182437; }
.dnav { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
.dnav .dtitle { flex: 1; text-align: center; font-size: 15.5px; font-weight: 500; }
.dnav button { width: 40px; height: 30px; border-radius: 0; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; }
.dnav button:disabled { opacity: .3; cursor: default; }
.dnav svg { width: 14px; height: 14px; }
.dhead { display: flex; align-items: center; gap: 12px; margin-top: 14px; flex-wrap: wrap; }
.dhead .hl { font: 500 40px/1.1 var(--font-display); letter-spacing: -0.02em; }
.dhead .hl .l { color: var(--fg3); margin-left: 6px; }
.dhead .wi { width: 40px; height: 40px; }
.dhead .lbl { font-size: 13px; color: var(--fg2); flex-basis: 100%; }
.dhead .lbl .faint { font-size: 12px; color: var(--fg3); }
.dhead .stat { font-size: 22px; font-weight: 500; }
.chartbox { margin-top: 10px; min-width: 0; }
.ch { display: block; width: 100%; height: auto; overflow: visible; }
.ch .gl { stroke: rgba(255,255,255,0.12); stroke-width: 1; }
.ch .gv { stroke: rgba(255,255,255,0.10); stroke-width: 1; stroke-dasharray: 2 3; }
.ch text { fill: var(--fg2); font: 500 11px var(--font-micro); }
.ch .mk { fill: var(--fg); font: 700 11px var(--font-micro); }
.toggle { display: grid; grid-template-columns: 1fr 1fr; background: rgba(255,255,255,0.08); border-radius: 0; padding: 3px; margin-top: 12px; }
.toggle button { padding: 8px; border-radius: 0; font-size: 14px; font-weight: 500; color: var(--fg2); }
.toggle button[aria-pressed="true"] { background: rgba(255,255,255,0.18); color: var(--fg); }
.dsec { margin-top: 18px; }
.dsec h3 { margin: 0 0 2px; font-size: 14px; font-weight: 700; }
.dsec .sub { font-size: 13px; color: var(--fg2); }
.dtext { margin-top: 18px; display: grid; gap: 10px; }
.dtext p { margin: 0; font-size: 14.5px; line-height: 1.45; }
.dtext b { display: block; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--fg2); margin-bottom: 2px; }
.dsrc { margin-top: 14px; font-size: 12px; color: var(--fg3); }
.arrows { position: relative; height: 34px; margin-top: 4px; }
.arrows div { position: absolute; top: 0; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--fg2); font-weight: 500; }
.arrows svg { width: 14px; height: 14px; }

/* loading + errors */
.skel { border-radius: var(--r); background: rgba(255,255,255,0.10); }
.state { text-align: center; padding: 60px 10px; }
.state h2 { font-size: 22px; font-weight: 500; margin: 0 0 6px; }
.state p { margin: 0 auto 14px; color: var(--fg2); max-width: 420px; }

.wi { display: block; width: 28px; height: 28px; overflow: visible; filter: drop-shadow(0 1px 1.5px rgba(0,0,0,0.18)); }

@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }

/* page stays still while a sheet is open */
html { scrollbar-gutter: stable; }
html.locked, html.locked body { overflow: hidden; }
.sheet { overscroll-behavior: contain; touch-action: none; }
.panel { touch-action: pan-y; }

.radar .offmsg { display: none; margin-top: 10px; padding: 26px 12px; text-align: center; font-size: 13px; color: var(--fg2); background: rgba(0,0,0,0.22); }
.radar.noimg img { display: none; }
.radar.noimg .offmsg { display: block; }

/* About Gridpoint */
.about { margin-top: auto; padding-top: 18px; border-top: 1px solid var(--hair); font-size: 12.5px; line-height: 1.45; color: var(--fg2); }
.sidebar .plist { margin-bottom: 24px; }
.about-name { font: 700 24px/1.1 var(--font-display); letter-spacing: -0.02em; color: var(--fg); }
.about-lead { margin: 6px 0 0; color: var(--fg); font-size: 13.5px; }
.about ul { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 9px; }
.about li b { display: block; color: var(--fg); font-weight: 500; }
.about-fine { margin: 12px 0 0; font-size: 11.5px; color: var(--fg3); }
.about-main { display: none; }
@media (max-width: 880px) {
  .about-main { display: block; margin: 22px 0 0; padding: 16px 14px 14px; background: var(--card); border: 1px solid var(--card-line); }
}
.places-panel .about { margin-top: 26px; }

/* chart readout (hover, drag, or arrow keys) */
.chartbox { touch-action: pan-y; -webkit-user-select: none; user-select: none; outline-offset: 4px; }
.dhead.big { min-height: 96px; }
.dhead.scrubbing, .dsec-head.scrubbing { display: block; }
.ro-time { font-size: 13px; color: var(--fg2); font-weight: 500; font-variant-numeric: tabular-nums; }
.ro-tag { margin-left: 8px; font: 500 10.5px var(--font-micro); letter-spacing: .07em; text-transform: uppercase; color: var(--fg3); }
.ro-main { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ro-main .wi { width: 34px; height: 34px; }
.ro-val { font: 500 40px/1.1 var(--font-display); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.ro.big .ro-sub { font-size: 13px; color: var(--fg2); min-height: 17px; }
.ro.compact .ro-val { font-size: 22px; line-height: 1.2; letter-spacing: -0.01em; }
.ro.compact .ro-sub { font-size: 13px; color: var(--fg2); }
.iconrow { position: relative; height: 24px; margin-top: 12px; pointer-events: none; }
.iconrow span { position: absolute; top: 0; transform: translateX(-50%); }
.iconrow .wi { width: 20px; height: 20px; }
.note { margin-top: 6px; font-size: 12.5px; color: var(--fg3); line-height: 1.45; }
.note.body { font-size: 14px; color: var(--fg); }

/* Home Screen guide: the tip on phones, the button under About, and the guide sheet */
.glyph { display: inline-block; width: 19px; height: 19px; vertical-align: -4px; color: #64c8ff; }
.kbd { display: inline-block; min-width: 24px; padding: 0 5px; border: 1px solid rgba(255,255,255,0.38); font: 700 12px/18px var(--font); text-align: center; vertical-align: 1px; color: #64c8ff; }
.tip { display: flex; align-items: center; gap: 10px; padding: 9px 8px 9px 14px; background: var(--card-strong); border: 1px solid var(--card-line); -webkit-backdrop-filter: blur(26px) saturate(150%); backdrop-filter: blur(26px) saturate(150%); font-size: 13.5px; line-height: 1.35; }
.tip-text { flex: 1; min-width: 0; text-wrap: pretty; }
.tip-text b { font-weight: 700; }
.tip-btn { flex: none; height: 32px; padding: 0 13px; background: #fff; color: #182437; font-size: 13.5px; font-weight: 700; }

function precipTotalHTML(m, row, d) {

  const liq = hrs.reduce((s, h) => s + (isNum(h.qpf) ? h.qpf : 0), 0);
  const snow = hrs.reduce((s, h) => s + (isNum(h.snow) ? h.snow : 0), 0);
  const what = liq < 0.005 && snow < 0.05 ? $t('None expected') : $t('{amt} of rain or melted snow', { amt: fmtPrecip(liq) }) + (snow >= 0.05 ? ' · ' + $t('{amt} of snow', { amt: fmtSnow(snow) }) : '');

/* A plain-language rundown built from the same numbers the charts show. Each sentence is a whole

function daySummaryHTML(m, row, d) {
  const tz = m.place.tz, now = d.now, isToday = row.date === ymd(now, tz), wd = weekdayLong(row.date);
  const pts = d.past.map(h => ({ t: h.t, v: h.tempF, f: obsFeels(h), obs: true }))
    .concat(d.fut.filter(h => h.t >= now && h.t < d.t1).map(h => ({ t: h.t, v: h.tempF, f: h.feelsF })))
    .filter(p => isNum(p.v));
  if (!pts.length || !isNum(row.hi)) return '';

  /* when the high happens: the warmest stretch of the day, between 7 AM and 7 PM like the NWS high */

  const near = pool.filter(p => p.v >= top - (pool.some(x => x.obs) ? 0.6 : 0));

  const span = !(first === last || last.t - first.t < 90 * 60e3);
  const how = span ? 'between' : first.obs ? 'at' : 'around';
  const v = { temp: fmtT(row.hi), time: clock(first), a: clock(first), b: clock(last), day: wd };

    'today-past-at': tk('Today’s high was {temp} at {time}.'), 'today-past-around': tk('Today’s high was {temp} around {time}.'), 'today-past-between': tk('Today’s high was {temp} between {a} and {b}.'),
    'today-will-at': tk('Today’s high will be {temp} at {time}.'), 'today-will-around': tk('Today’s high will be {temp} around {time}.'), 'today-will-between': tk('Today’s high will be {temp} between {a} and {b}.'),
    'day-will-at': tk('{day}’s high will be {temp} at {time}.'), 'day-will-around': tk('{day}’s high will be {temp} around {time}.'), 'day-will-between': tk('{day}’s high will be {temp} between {a} and {b}.'),
  };
  out.push(cap($t(HIGH[`${isToday ? 'today' : 'day'}-${isToday && highPast ? 'past' : 'will'}-${how}`], v)));

      if (!low) out.push(cap($t(isToday ? tk('Tonight’s low will be {temp}.') : tk('{day} night’s low will be {temp}.'), lv)));
      else {
        lv.time = fmtHourLbl(low.t, tz).replace(/(AM|PM)$/, ' $1');

        if (nextDay) lv.day2 = weekdayLong(ymd(low.t, tz));
        out.push(cap($t(isToday ? tk('Tonight’s low will be {temp} around {time}.') : nextDay ? tk('{day} night’s low will be {temp} around {time} {day2}.') : tk('{day} night’s low will be {temp} around {time}.'), lv)));

function searchKeys(e) {
  const t = e.target;
  if (!t || !t.id || !t.id.startsWith('q-')) return false;
  const rs = state.results || [];
  if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && rs.length) {
    e.preventDefault();
    state.hl = state.hl < 0 ? (e.key === 'ArrowDown' ? 0 : rs.length - 1) : (state.hl + (e.key === 'ArrowDown' ? 1 : -1) + rs.length) % rs.length;
    renderSearch();
    const row = $(`res-${t.id.slice(2)}-${state.hl}`);
    if (row) row.scrollIntoView({ block: 'nearest' });
    return true;
  }
  if (e.key === 'Enter') {
    e.preventDefault();
    if (rs.length) addPlace(rs[Math.max(0, Math.min(state.hl, rs.length - 1))]);
    return true;
  }
  if (e.key === 'Escape' && state.query) {
    e.preventDefault();
    t.value = '';
    runSearch('');
    return true;
  }
  return false;
}
document.addEventListener('keydown', e => {
  if (searchKeys(e)) return;
  if (e.key === 'Escape') {
    if (scrub) { endScrub(); return; }
    if (!$('langSheet').hidden) { closeLang(); return; }
    if (!$('bugSheet').hidden) { closeBug(); return; }
    if (!$('installSheet').hidden) { closeGuide(); return; }
    if (!$('daySheet').hidden) { state.day = null; $('daySheet').hidden = true; return; }
    if (!$('placesSheet').hidden) { $('placesSheet').hidden = true; return; }
  }
  const box = document.activeElement && document.activeElement.closest && document.activeElement.closest('.chartbox[data-scrub]');
  if (box && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
    e.preventDefault();
    const en = SCRUB.get(box.dataset.scrub);
    const from = scrub && scrub.box === box ? scrub.t : (en && en.t0 <= Date.now() && Date.now() <= en.t1 ? Date.now() : en ? en.t0 : 0);
    scrubTo(box, from + (e.key === 'ArrowLeft' ? -HOUR : HOUR) * (scrub && scrub.box === box ? 1 : 0));
    return;
  }
  if (!$('daySheet').hidden && (e.key === 'ArrowLeft' || e.key === 'ArrowRight') && !(e.target && e.target.tagName === 'INPUT')) {
    stepDay(e.key === 'ArrowLeft' ? -1 : 1);
  }
});
function stepDay(n) {
  const m = viewModel(state.models[state.selected]); if (!m) return;
  const dates = m.daily.map(d => d.date), i = dates.indexOf(state.day) + n;
  if (i >= 0 && i < dates.length) { state.day = dates[i]; renderDaySheet(); }
}
document.addEventListener('click', e => {
  const el = e.target.closest('button, [data-close]');
  if (e.target === $('daySheet')) { state.day = null; $('daySheet').hidden = true; return; }
  if (e.target === $('placesSheet')) { $('placesSheet').hidden = true; return; }
  if (e.target === $('installSheet')) { closeGuide(); return; }
  if (e.target === $('bugSheet')) { closeBug(); return; }
  if (e.target === $('langSheet')) { closeLang(); return; }
  if (!el) return;
  const d = el.dataset;
  if ('lang' in d) { openLang(); return; }
  if (d.setLang) { setLanguage(d.setLang); return; }
  if ('closeLang' in d) { closeLang(); return; }
  if ('bug' in d) { openBug(); return; }
  if ('closeBug' in d) { closeBug(); return; }
  if ('bugSend' in d) { sendBug(); return; }
  if ('bugCopy' in d) { copyBug(el); return; }
  if ('install' in d) { openGuide(); return; }
  if ('installGo' in d) { promptInstall(); return; }
  if ('closeGuide' in d) { closeGuide(); return; }
  if ('tipX' in d) { store.set('tipDone', true); renderMain(); return; }
  if ('shareApp' in d) { shareApp(el); return; }
  if (d.del) {
    state.places = state.places.filter(p => p.id !== d.del); store.set('places', state.places); store.del('model:' + d.del); store.del('ext:' + d.del);
    if (state.selected === d.del) state.selected = state.places[0].id;
    store.set('selected', state.selected); render(); return;
  }
  if (d.place) { if (!state.editing) select(d.place); return; }
  if (d.result != null && state.results) { addPlace(state.results[+d.result]); return; }
  if ('edit' in d) { state.editing = !state.editing; render(); return; }
  if ('here' in d) { locate(el); return; }
  if (d.units) { state.units = d.units; store.set('units', d.units); render(); return; }
  if ('refresh' in d) { loadPlace(selectedPlace(), { force: true }); return; }
  if ('openPlaces' in d) { renderPlacesSheet(); $('placesSheet').hidden = false; return; }
  if ('close' in d) { state.day = null; $('daySheet').hidden = true; $('placesSheet').hidden = true; return; }
  if (d.day) { state.day = d.day; state.metric = state.metric || 'conditions'; renderDaySheet(); const p = $('daySheet').querySelector('.panel'); if (p) p.scrollTop = 0; return; }
  if (d.goto) { state.day = d.goto; renderDaySheet(); return; }
  if (d.step) { stepDay(+d.step); return; }
  if (d.metric) { state.metric = d.metric; renderDaySheet(); return; }
  if (d.feels != null) { state.feels = d.feels === '1'; renderDaySheet(); return; }
  if (d.alert) { state.openAlert = state.openAlert === d.alert ? null : d.alert; renderMain(); return; }
  if ('afd' in d) { state.afdOpen = !state.afdOpen; renderMain(); return; }
});
function locate(btn) {
  const old = btn.innerHTML;
  btn.textContent = $t('Finding you…');
  navigator.geolocation.getCurrentPosition(pos => {
    const lat = +pos.coords.latitude.toFixed(4), lon = +pos.coords.longitude.toFixed(4);
    const existing = state.places.find(p => p.id === 'here');
    if (existing) { existing.lat = lat; existing.lon = lon; }
    else state.places.unshift({ id: 'here', name: 'My Location', region: '', lat, lon });
    store.set('places', state.places);
    delete state.models.here;
    select('here');
  }, err => {
    btn.innerHTML = old;
    const n = document.createElement('div');
    n.className = 'sb-foot';
    n.textContent = err && err.code === 1 ? $t('Location permission was denied. Search for your city instead.') : $t('Your location isn’t available right now. Search for your city instead.');
    btn.after(n);
  }, { enableHighAccuracy: false, timeout: 12000, maximumAge: 10 * 60e3 });
}
/* charts: hover with a mouse, drag with a finger */
const daySheetEl = $('daySheet');
daySheetEl.addEventListener('pointermove', scrubFromPointer);
daySheetEl.addEventListener('pointerdown', scrubFromPointer);
daySheetEl.addEventListener('pointerleave', () => endScrub());
daySheetEl.addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') endScrub(); });
daySheetEl.addEventListener('pointercancel', () => endScrub());
daySheetEl.addEventListener('focusout', e => { if (e.target && e.target.classList && e.target.classList.contains('chartbox')) endScrub(); });
/* while a sheet is open, the page behind it stays put */
const lockPage = () => {
  const open = ['daySheet', 'placesSheet', 'installSheet', 'bugSheet', 'langSheet'].some(id => !$(id).hidden);
  document.documentElement.classList.toggle('locked', open);
  if (!open) endScrub();
};
const lockObs = new MutationObserver(lockPage);
for (const id of ['daySheet', 'placesSheet', 'installSheet', 'bugSheet', 'langSheet']) lockObs.observe($(id), { attributes: true, attributeFilter: ['hidden'] });
let resizeT = 0;
window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (!$('daySheet').hidden) renderDaySheet(); }, 150); });
function maybeRefresh() {
  if (document.hidden) return;
  const p = selectedPlace(), m = state.models[p.id];
  if (!state.loading[p.id] && (!m || Date.now() - m.fetchedAt > REFRESH_MS)) loadPlace(p);
}
document.addEventListener('visibilitychange', maybeRefresh);
window.addEventListener('online', () => { for (const k of Object.keys(state.errors)) delete state.errors[k]; loadAll(); });
window.addEventListener('offline', () => render());
setInterval(() => { maybeRefresh(); const m = state.models[state.selected]; if (m && !document.hidden) { renderBar(); renderSidebar(); } }, 60e3);

/* the language's words are on the device after the first time, so the first paint is already in it */
const langReady = applyLang();
render();
loadAll();
routeGuide();
langReady.then(changed => { if (changed) rerenderAll(); });

/* A newer Gridpoint was just saved on the device (the service worker says so after each visit). Switch to it
   right away if the visitor hasn't started using the page yet, otherwise offer it, so an update shows up the
   first time the app is opened after it, not the second. */
let touched = false;
for (const t of ['pointerdown', 'keydown']) addEventListener(t, () => { touched = true; }, { capture: true, passive: true });
function appUpdated(build) {
  if (!build || build === APP_BUILD || document.querySelector('.upd-bar')) return;
  let done = null;
  try { done = sessionStorage.getItem('gp:reloadedFor'); } catch (e) {}
  if (!touched && performance.now() < 10000 && done !== build) {
    try { sessionStorage.setItem('gp:reloadedFor', build); } catch (e) {}
    location.reload();
    return;
  }
  const bar = document.createElement('div');
  bar.className = 'tip upd-bar';
  bar.setAttribute('role', 'status');
  bar.innerHTML = `<div class="tip-text">${esc($t('A new version of Gridpoint is ready.'))}</div><button class="tip-btn" data-upd-go>${esc($t('Refresh'))}</button><button class="tip-x" data-upd-x aria-label="${esc($t('Close'))}">${ui('close')}</button>`;
  bar.querySelector('[data-upd-go]').addEventListener('click', () => location.reload());
  bar.querySelector('[data-upd-x]').addEventListener('click', () => bar.remove());
  document.body.appendChild(bar);
}
if ('serviceWorker' in navigator && window.isSecureContext) {
  navigator.serviceWorker.addEventListener('message', e => { const d = e.data; if (d && d.type === 'gp-updated') appUpdated(d.build); });
  navigator.serviceWorker.startMessages();
}

/* When served from a web address, save the app on the device (service worker) so it opens
   with no connection, and offer the manifest so it can be added to a Home Screen or Dock.
   Skipped when the file is opened directly from a disk. */
if (/^https?:$/.test(location.protocol)) {
  const link = document.createElement('link');
  link.rel = 'manifest'; link.href = 'manifest.json';
  document.head.appendChild(link);
  if ('serviceWorker' in navigator && window.isSecureContext) navigator.serviceWorker.register('sw.js').catch(() => {});
}
})();
</script>
</body>
