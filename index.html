<style>
/* Layout: Apple Weather on the Mac — places sidebar on the left, one location's sky on the right;
   on a phone the sidebar becomes a sheet. Sky gradient + translucent cards, white type. */
:root {
  --sky1: #2c6fc0;
  --sky2: #78b4ea;
  --card: rgba(9, 22, 46, 0.24);
  --card-strong: rgba(9, 22, 46, 0.34);
  --card-line: rgba(255, 255, 255, 0.10);
  --hair: rgba(255, 255, 255, 0.16);
  --fg: #ffffff;
  --fg2: rgba(255, 255, 255, 0.72);
  --fg3: rgba(255, 255, 255, 0.50);
  --rain: #6fd0ff;
  --panel: rgba(30, 34, 44, 0.94);
  --sev-extreme: #ff5b4f;
  --sev-moderate: #ff9f43;
  --sev-minor: #ffd166;
  --font: "Helvetica Now Text", "Helvetica Now", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --font-display: "Helvetica Now Display", "Helvetica Now", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --font-micro: "Helvetica Now Micro", "Helvetica Now Text", "Helvetica Now", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --r: 0px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  font: 15px/1.35 var(--font);
  color: var(--fg);
  background: var(--sky1);
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
  overflow-x: hidden;
}
.sky { position: fixed; inset: 0; z-index: -2; background: linear-gradient(180deg, var(--sky1) 0%, var(--sky2) 100%); transition: opacity .6s; }
#fx { position: fixed; inset: 0; z-index: -1; pointer-events: none; width: 100%; height: 100%; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
a { color: inherit; }
:focus-visible { outline: 2px solid rgba(255,255,255,0.9); outline-offset: 2px; }
[hidden] { display: none !important; }

.app { display: grid; grid-template-columns: 312px minmax(0, 1fr); min-height: 100vh; }
.sidebar {
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  padding: max(18px, env(safe-area-inset-top, 0px)) 14px 18px max(14px, env(safe-area-inset-left, 0px));
  background: rgba(6, 14, 30, 0.38);
  -webkit-backdrop-filter: blur(30px) saturate(140%); backdrop-filter: blur(30px) saturate(140%);
  border-right: 1px solid var(--card-line);
  display: flex; flex-direction: column;
}
.main {
  width: 100%; max-width: 1040px; margin: 0 auto;
  padding-block: max(14px, env(safe-area-inset-top, 0px)) max(28px, env(safe-area-inset-bottom, 0px));
  padding-left: max(18px, env(safe-area-inset-left, 0px));
  padding-right: max(18px, env(safe-area-inset-right, 0px));
}
@media (max-width: 880px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .sidebar { display: none; }
  .main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}

/* top bar */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 36px; }
.bar-left, .bar-right { display: flex; align-items: center; gap: 8px; }
.iconbtn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 34px; min-width: 34px; padding: 0 10px; border-radius: 0;
  background: rgba(255,255,255,0.14); color: var(--fg); font-size: 13px; font-weight: 500;
  -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
}
.iconbtn:hover { background: rgba(255,255,255,0.22); }
.iconbtn svg { width: 16px; height: 16px; }
.phone-only { display: none; }
@media (max-width: 880px) { .phone-only { display: inline-flex; } }
.seg { display: inline-flex; background: rgba(255,255,255,0.14); border-radius: 0; padding: 2px; height: 34px; }
.seg button { padding: 0 11px; border-radius: 0; font-size: 13px; font-weight: 500; color: var(--fg2); }
.seg button[aria-pressed="true"] { background: rgba(255,255,255,0.92); color: #1d2f4a; }
.updated { font-size: 12px; color: var(--fg2); white-space: nowrap; }
.spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* hero */

<script>
'use strict';
(() => {
/* ============================== config ============================== */

  { id: 'northfield-mn', name: 'Northfield', region: 'MN', lat: 44.4620, lon: -93.1830 },

const NWS = 'https://api.weather.gov';
const MODEL_VERSION = 6;
const REFRESH_MS = 10 * 60 * 1000;
const HOUR = 3600e3, DAY = 864e5;

/* ============================== storage ============================== */
const store = {
  get(k, d = null) { try { const v = localStorage.getItem('gp:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('gp:' + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem('gp:' + k); } catch (e) {} },
};

const state = {
  places: store.get('places') || DEFAULT_PLACES.map(p => ({ ...p })),
  selected: store.get('selected') || DEFAULT_PLACES[0].id,
  units: store.get('units') || 'us',
  models: {}, loading: {}, errors: {},
  editing: false,
  day: null, metric: 'conditions', feels: false,
  results: null, query: '',

if (!Array.isArray(state.places) || !state.places.length) state.places = DEFAULT_PLACES.map(p => ({ ...p }));
if (!state.places.some(p => p.id === state.selected)) state.selected = state.places[0].id;
for (const p of state.places) {
  const m = store.get('model:' + p.id);
  if (m && m.v === MODEL_VERSION) state.models[p.id] = m;
}

/* ============================== units ============================== */
const cToF = c => (c == null || isNaN(c)) ? null : c * 9 / 5 + 32;
const kmhToMph = k => (k == null || isNaN(k)) ? null : k / 1.609344;

const metric = () => state.units === 'metric';
const tDisp = f => isNum(f) ? (metric() ? (f - 32) * 5 / 9 : f) : null;
const fmtT = f => isNum(f) ? Math.round(tDisp(f)) + '°' : '--';
const fmtWind = mph => !isNum(mph) ? '--' : metric() ? Math.round(mph * 1.609344) + ' km/h' : Math.round(mph) + ' mph';

function loadPlace(place, { force = false } = {}) {

  state.loading[place.id] = true;
  delete state.errors[place.id];
  if (place.id === state.selected) renderBar();
  const job = (async () => {
    try {
      const pt = await getPoint(place);
      /* if the model feed hiccups on a refresh, keep using the last good copy for up to 12 hours */
      if (!lastExt.has(place.id)) { const c = store.get('ext:' + place.id); if (c && c.j) lastExt.set(place.id, c); }
      const prev = lastExt.get(place.id);
      const extP = prev && Date.now() - prev.t < HOUR ? Promise.resolve(prev.j)

    <a href="https://radar.weather.gov/station/${esc(id.toLowerCase())}/standard" target="_blank" rel="noopener"><img src="https://radar.weather.gov/ridge/standard/${esc(id)}_loop.gif?t=${bust}" alt="Radar loop from ${esc(id)}" loading="lazy" onerror="this.closest('.radar').classList.add('noimg')"></a>

function afdCard(m) {
  const a = m.afd;
  if (!a || !a.sections || !a.sections.length) return '';
  const tz = m.place.tz, open = !!state.afdOpen;
  const title = n => n.charAt(0) + n.slice(1).toLowerCase();
  let html = '', shown = 0;
  for (const sec of a.sections) {
    const key = /^KEY MESSAGES/.test(sec.name);
    if (!open && !key && shown >= 1) break;
    html += `<h4>${esc(title(sec.name))}${sec.issued ? `<span>${esc(sec.issued)}</span>` : ''}</h4>`;
    if (key || sec.paras.every(p => /^[-*•]\s/.test(p))) {
      /* some offices group key messages under area names ("West Coast and Western Interior...") */
      let items = sec.paras, more = false;
      if (!open) {
        const keep = []; let n = 0;
        for (const p of sec.paras) { const head = /\.\.\.$/.test(p) && p.length < 90; if ((!head && ++n > 5) || (head && n >= 5)) break; keep.push(p); }
        more = keep.length < sec.paras.length; items = keep;
      }
      html += `<ul>${items.map(p => /\.\.\.$/.test(p) && p.length < 90 ? `<li class="khead">${esc(p.replace(/\.\.\.$/, ''))}</li>` : `<li>${esc(p.replace(/^[-*•]\s*/, ''))}</li>`).join('')}</ul>`;
      if (more) shown++;
    } else {
      const ps = open ? sec.paras : sec.paras.slice(0, 1);
      html += ps.map(p => `<p>${esc(p)}</p>`).join('');
      shown += ps.length;
    }
  }
  return `<section class="card afd"><div class="card-h">${ui('info')} Forecaster's discussion<span class="right">NWS ${esc(m.place.office)} · ${esc(fmtWhen(a.issued, tz))}</span></div><div class="rule"></div>
    <div class="afd-body">${html}</div><button class="textbtn morebtn" data-afd aria-expanded="${open}">${open ? 'Show less' : 'Read the full discussion'}</button></section>`;
}
function sourcesCard(m) {

/* ============================== day sheet ============================== */
const METRICS = [['conditions', 'Conditions'], ['precip', 'Precipitation'], ['wind', 'Wind'], ['humidity', 'Humidity'], ['clouds', 'Clouds']];
function dayData(m, date) {
  const tz = m.place.tz, t0 = dayStart(date, tz), t1 = dayStart(addDays(date, 1), tz), now = Date.now();
  const fut = m.hourly.filter(h => h.t >= t0 && h.t <= t1 && h.t + HOUR > now);
  const past = (m.hist || []).filter(h => h.t >= t0 && h.t <= Math.min(t1, now));
  /* the last reading before midnight, so just after midnight the line still starts from what was measured */
  const lead = (m.hist || []).filter(h => h.t < t0 && now - h.t < 2 * HOUR).pop() || null;
  return { t0, t1, fut, past, lead, now };
}
const obsFeels = h => feelsLike(h.tempF, h.rh, h.windMph || 0);
const dayWord = (m, date) => date === ymd(Date.now(), m.place.tz) ? 'Today' : weekdayLong(date);
/* condition at a given hour: the forecast hour, or for hours already gone, the station's report */
function conditionAt(m, t) {
  const now = Date.now();
  if (t + HOUR > now) {
    const h = m.hourly.find(x => Math.abs(x.t - t) < 31 * 60e3);
    if (h) return { code: h.code, pop: h.pop };
  }
  let best = null;
  for (const h of m.hist || []) if (h.code && Math.abs(h.t - t) < 45 * 60e3 && (!best || Math.abs(h.t - t) < Math.abs(best.t - t))) best = h;
  if (best) return { code: best.code, pop: 0 };
  const h = m.hourly.find(x => Math.abs(x.t - t) < 31 * 60e3);
  return h ? { code: h.code, pop: h.pop } : null;
}
const dayAt = (m, t) => sunAltitude(t, m.place.lat, m.place.lon) > -0.833;
function iconAt(m, t) {
  const c = conditionAt(m, Math.round(t / HOUR) * HOUR) || conditionAt(m, t);
  return c ? wi(iconId(c.code, dayAt(m, t), c.pop)) : '';
}

function renderDaySheet() {
  const m = viewModel(state.models[state.selected]), sh = $('daySheet');
  if (!m || !state.day) { sh.hidden = true; return; }
  endScrub();
  const tz = m.place.tz, today = ymd(Date.now(), tz), dates = m.daily.map(d => d.date);
  if (!dates.includes(state.day)) state.day = dates[0];
  const idx = dates.indexOf(state.day), row = m.daily[idx];
  const d = dayData(m, state.day);
  const { fut, past } = d;
  const panelScroll = sh.querySelector('.panel') ? sh.querySelector('.panel').scrollTop : 0;
  const strip = dates.map(x => `<button class="dchip${x === today ? ' today' : ''}" data-goto="${x}" aria-current="${x === state.day}" aria-label="${esc(longDate(x))}"><span class="w">${weekdayInitial(x)}</span><span class="n">${+x.slice(8)}</span></button>`).join('');
  const tabs = METRICS.map(([k, l]) => `<button role="tab" data-metric="${k}" aria-selected="${state.metric === k}">${l}</button>`).join('');
  const isToday = row.date === today, name = dayWord(m, row.date);
  let head = '', body = '';
  const srcs = [...new Set(fut.map(h => h.src))];
  const srcText = (past.length ? 'Gray line: measured at ' + (m.current && m.current.station ? m.current.station.id : 'the nearest station') + '. ' : '') + (srcs.length ? 'Forecast: ' + srcs.map(s => s === 'NWS' ? 'NWS hourly forecast' : extName(m)).join(' + ') + '.' : '');
  const chartBox = (id, label) => `<div class="chartbox" id="${id}" tabindex="0" aria-label="${esc(label)}. Hover, drag or use the arrow keys to read values."></div>`;
  if (state.metric === 'conditions') {
    if (!state.feels) {
      /* say which hours the two numbers cover: NWS pairs a day's high with the low of the night after it */
      const hiWord = isNum(row.hi) ? (isToday ? (row.hiObs ? 'High measured today' : 'High today') : 'High ' + weekdayLong(row.date)) : '';
      const loWord = isNum(row.lo) ? (row.loPre ? 'Low early this morning' : 'Low ' + (isToday ? 'tonight' : weekdayLong(row.date) + ' night')) + (row.loEst ? ' (model blend)' : '') : '';
      head = `<div class="dhead big" id="dhead"><div class="hl">${isNum(row.hi) ? fmtT(row.hi) : ''}<span class="l">${isNum(row.lo) ? fmtT(row.lo) : ''}</span></div>${wi(iconId(row.code, row.isDay !== false, row.pop))}<div class="lbl">${esc(row.text)}${row.src === 'NBM' ? ' · ' + esc(extName(m)) : ''}<br><span class="faint">${[hiWord, loWord].filter(Boolean).join(' · ')}</span></div></div>`;
    } else {
      const fs = past.map(obsFeels).concat(fut.map(h => h.feelsF)).filter(isNum);
      head = `<div class="dhead big" id="dhead"><div class="hl">${fs.length ? fmtT(Math.max(...fs)) : ''}<span class="l">${fs.length ? fmtT(Math.min(...fs)) : ''}</span></div>${wi(iconId(row.code, row.isDay !== false, row.pop))}<div class="lbl">Feels like<br><span class="faint">Warmest and coldest it feels across the day, wind and humidity included</span></div></div>`;
    }
    body += `<div class="iconrow" id="iconrow" aria-hidden="true"></div>${chartBox('c1', 'Temperature by hour')}
      <div class="toggle" role="group" aria-label="Temperature type"><button data-feels="0" aria-pressed="${!state.feels}">Actual</button><button data-feels="1" aria-pressed="${state.feels}">Feels Like</button></div>
      <div class="dsec"><div id="c2head" class="dsec-head"><h3>Chance of precipitation</h3><div class="sub">${esc(dayChanceLine(row, name))}</div></div>${chartBox('c2', 'Chance of precipitation by hour')}
        <div class="note">The chance for a whole day or night tends to be higher than the chance for any single hour.</div></div>
      ${precipTotalHTML(m, row, d)}
      ${daySummaryHTML(m, row, d)}
      <div class="dsec"><h3>About Feels Like</h3><div class="note">Feels Like is how the air will feel on your skin. In the cold it uses the National Weather Service wind chill formula (50°F or colder with at least 3 mph of wind); in the heat it uses the NWS heat index (80°F or warmer). Otherwise it matches the actual temperature.</div></div>`;
  } else if (state.metric === 'precip') {
    const tot = fut.reduce((s, h) => s + (isNum(h.qpf) ? h.qpf : 0), 0) || (row.src === 'NBM' && isNum(row.qpf) ? row.qpf : 0);
    const sn = fut.reduce((s, h) => s + (isNum(h.snow) ? h.snow : 0), 0);
    head = `<div class="dhead" id="dhead"><div class="stat">${fmtPrecip(tot)}${sn >= 0.05 ? ` · ${fmtSnow(sn)} snow` : ''}</div><div class="lbl">Expected ${isToday ? 'for the rest of today' : 'for the day'} · highest hourly chance ${round10(Math.max(0, ...fut.map(h => h.pop)))}%</div></div>`;
    body += `${chartBox('c1', 'Chance of precipitation by hour')}<div class="dsec"><div id="c2head" class="dsec-head"><h3>Amount per hour</h3><div class="sub">Liquid equivalent, from the forecast grid</div></div>${chartBox('c2', 'Precipitation amount by hour')}</div>`;
  } else if (state.metric === 'wind') {
    const mx = Math.max(0, ...fut.map(h => h.windMph || 0), ...past.map(h => h.windMph || 0));
    const gx = Math.max(0, ...fut.map(h => h.gustMph || 0), ...past.map(h => h.gustMph || 0));
    head = `<div class="dhead" id="dhead"><div class="stat">${fmtWind(mx)}</div><div class="lbl">Strongest sustained wind${gx > mx ? ` · gusts to ${fmtWind(gx)}` : ''}</div></div>`;
    body += `${chartBox('c1', 'Wind by hour')}<div class="arrows" id="arrows"></div><div class="dsrc" style="margin-top:6px">Solid line: sustained wind. Dashes and dots: gusts. Arrows point the way the wind blows; letters show where it comes from.</div>`;
  } else if (state.metric === 'humidity') {
    const all = fut.concat(past).map(h => h.rh).filter(isNum);
    const dews = fut.concat(past).map(h => h.dewF).filter(isNum);
    head = `<div class="dhead" id="dhead"><div class="stat">${all.length ? Math.round(all.reduce((a, b) => a + b, 0) / all.length) + '%' : '--'}</div><div class="lbl">Average relative humidity${dews.length ? ` · dew point ${fmtT(Math.min(...dews))} to ${fmtT(Math.max(...dews))}` : ''}</div></div>`;
    body += chartBox('c1', 'Relative humidity by hour');
  } else {
    const sk = fut.map(h => h.sky).filter(isNum);
    head = `<div class="dhead" id="dhead"><div class="stat">${sk.length ? Math.round(sk.reduce((a, b) => a + b, 0) / sk.length) + '%' : '--'}</div><div class="lbl">Average sky cover</div></div>`;
    body += chartBox('c1', 'Sky cover by hour');
  }
  let text = '';
  if (row.dayText) text += `<p><b>${esc(row.dayName)}</b>${esc(row.dayText)}</p>`;
  if (row.nightText) text += `<p><b>${esc(row.nightName)}</b>${esc(row.nightText)}</p>`;
  if (row.src === 'NBM') text += `<p><b>Extended outlook</b>This day is past the official 7-day forecast. Numbers come from the ${esc(extName(m))} and haven't been adjusted by a forecaster.</p>`;
  sh.innerHTML = `<div class="panel" role="dialog" aria-modal="true" aria-label="${esc(longDate(state.day))}">
    <div class="panel-top"><div class="tabs" role="tablist">${tabs}</div><button class="xbtn" data-close aria-label="Close">${ui('close')}</button></div>
    <div class="dstrip" style="--n:${dates.length}">${strip}</div>
    <div class="dnav"><button data-step="-1" ${idx <= 0 ? 'disabled' : ''} aria-label="Previous day">${ui('left')}</button><div class="dtitle">${esc(longDate(state.day))}</div><button data-step="1" ${idx >= dates.length - 1 ? 'disabled' : ''} aria-label="Next day">${ui('right')}</button></div>
    ${head}${body}<div class="dtext">${text}</div><div class="dsrc">${esc(srcText)}</div></div>`;
  sh.hidden = false;

  const p = sh.querySelector('.panel'); if (p) p.scrollTop = panelScroll;
}
function dayChanceLine(row, name) {
  if (row.src === 'NBM') return `Highest hourly chance: ${round10(row.pop)}%`;
  const who = row.dayName ? name + '’s' : (name === 'Today' ? 'Tonight’s' : name + ' night’s');
  return `${who} chance: ${round10(row.pop)}%`;
}
function precipTotalHTML(m, row, d) {
  const isToday = row.date === ymd(d.now, m.place.tz);
  const hrs = d.fut.filter(h => h.t < d.t1);
  const liq = hrs.reduce((s, h) => s + (isNum(h.qpf) ? h.qpf : 0), 0);
  const snow = hrs.reduce((s, h) => s + (isNum(h.snow) ? h.snow : 0), 0);
  const what = liq < 0.005 && snow < 0.05 ? 'None expected' : `${fmtPrecip(liq)} of rain or melted snow${snow >= 0.05 ? ` · ${fmtSnow(snow)} of snow` : ''}`;
  return `<div class="dsec"><h3>Precipitation total</h3><div class="sub">${isToday ? 'Rest of today' : 'For the day'}: ${esc(what)}</div></div>`;
}
/* A plain-language rundown built from the same numbers the charts show. */
function daySummaryHTML(m, row, d) {
  const tz = m.place.tz, now = d.now, isToday = row.date === ymd(now, tz), name = dayWord(m, row.date);
  const pts = d.past.map(h => ({ t: h.t, v: h.tempF, f: obsFeels(h), obs: true }))
    .concat(d.fut.filter(h => h.t >= now && h.t < d.t1).map(h => ({ t: h.t, v: h.tempF, f: h.feelsF })))
    .filter(p => isNum(p.v));
  if (!pts.length || !isNum(row.hi)) return '';
  const clock = (p) => p.obs ? fmtClock(p.t, tz) : fmtHourLbl(p.t, tz).replace(/(AM|PM)$/, ' $1');
  const out = [];
  /* when the high happens: the warmest stretch of the day, between 7 AM and 7 PM like the NWS high */
  const dayPts = pts.filter(p => { const hh = localHour(p.t, tz); return hh >= 7 && hh <= 19; });
  const pool = row.hiObs || !dayPts.length ? pts : dayPts;
  const top = Math.max(...pool.map(p => p.v));
  const near = pool.filter(p => p.v >= top - (pool.some(x => x.obs) ? 0.6 : 0));
  const first = near[0], last = near[near.length - 1];
  const highPast = row.hiObs || (isToday && last.obs);
  const when = first === last || last.t - first.t < 90 * 60e3 ? `${first.obs ? 'at' : 'around'} ${clock(first)}` : `between ${clock(first)} and ${clock(last)}`;
  out.push(`${name}’s high ${highPast ? 'was' : 'will be'} ${fmtT(row.hi)} ${when}.`);
  /* the low that goes with it: the night after, like the NWS forecast, timed from the hourly values */
  if (isNum(row.lo)) {
    if (row.loPre) out.push(`The low was ${fmtT(row.lo)} early this morning.`);
    else {
      const n0 = zoned(...splitDate(row.date), 19, 0, tz), n1 = zoned(...splitDate(addDays(row.date, 1)), 8, 0, tz);
      const night = m.hourly.filter(h => h.t >= n0 && h.t <= n1 && isNum(h.tempF));
      const low = night.length ? night.reduce((b, h) => h.tempF < b.tempF ? h : b) : null;
      const nm = isToday ? 'Tonight' : name + ' night';
      const at = low ? ` around ${fmtHourLbl(low.t, tz).replace(/(AM|PM)$/, ' $1')}${ymd(low.t, tz) !== row.date ? (isToday ? '' : ' ' + weekdayLong(ymd(low.t, tz))) : ''}` : '';
      out.push(`${nm}’s low will be ${fmtT(row.lo)}${at}.`);
    }
  }
  const fs = pts.map(p => p.f).filter(isNum);
  if (fs.length) {
    const lo = Math.min(...fs), hi = Math.max(...fs);
    out.push(`With wind and humidity factored in, it ${isToday ? 'feels' : 'will feel'} like ${fmtT(lo)} to ${fmtT(hi)}.`);
    const n = pts.filter(p => isNum(p.f)).length;
    const colder = pts.filter(p => isNum(p.f) && p.f <= p.v - 3).length / n, warmer = pts.filter(p => isNum(p.f) && p.f >= p.v + 3).length / n;
    if (colder >= 0.25) out.push('Wind makes it feel colder than the actual temperature for much of the day.');
    else if (warmer >= 0.25) out.push('Humidity makes it feel warmer than the actual temperature for much of the day.');
    else out.push('It feels close to the actual temperature most of the day.');
  }
  return `<div class="dsec"><h3>Daily summary</h3><div class="note body">${esc(out.join(' '))}</div></div>`;
}

function drawDayCharts(m, d) {
  const { t0, t1, fut, past, lead, now } = d, tz = m.place.tz;
  const box1 = $('c1'), box2 = $('c2');
  if (!box1) return;
  SCRUB.clear();
  const w = Math.max(280, box1.clientWidth || 600);
  const nowIn = now > t0 && now < t1 ? now : null;
  const P = (arr, f) => arr.map(h => ({ t: h.t, v: f(h) })).filter(p => isNum(p.v));
  const L = f => (lead && P([lead], f)[0]) || null;
  const tag = t => t <= now ? 'Measured' : 'Forecast';
  const pctFmt = v => v + '%';
  if (state.metric === 'conditions') {
    const actual = h => tDisp(h.tempF), feels = h => tDisp(isNum(h.feelsF) ? h.feelsF : h.tempF);
    const pastMain = P(past, state.feels ? h => tDisp(obsFeels(h)) : actual);
    const futMain = P(fut, state.feels ? feels : actual);
    const all = pastMain.concat(futMain);
    if (!all.length) { box1.innerHTML = '<div class="sub">No hourly data for this day yet.</div>'; }
    else {
      /* in Feels Like mode the actual temperature rides along as a gray line, like Apple Weather */
      const actPts = state.feels ? P(past, actual).concat(P(fut, actual)).sort((a, b) => a.t - b.t) : [];
      const ld = L(state.feels ? h => tDisp(obsFeels(h)) : actual);
      const vs = all.map(p => p.v).concat(actPts.map(p => p.v), ld && nowIn ? [ld.v] : []);
      const step = Math.max(...vs) - Math.min(...vs) > 28 ? 10 : 5;
      const yMin = Math.floor((Math.min(...vs) - 2) / step) * step, yMax = Math.ceil((Math.max(...vs) + 2) / step) * step;
      paint(box1, {
        w, h: 210, t0, t1, tz, yMin, yMax, yStep: step, yFmt: v => Math.round(v) + '°', now: nowIn, past: pastMain, fut: futMain, lead: ld,
        color: 'temp', area: true, hilo: true, extra: actPts.length ? [{ pts: actPts, color: 'rgba(255,255,255,.38)', width: 1.6 }] : [],
        scrub: {
          head: 'dhead', mode: 'smooth',
          fmt: p => readout('big', fmtClock(p.t, tz), tag(p.t), iconAt(m, p.t), Math.round(p.v) + '°',
            state.feels ? (isNum(interp(actPts, p.t)) ? `Actual: ${Math.round(interp(actPts, p.t))}°` : '') : ''),
        },
      });
      fillIconRow(m, d, w);
    }
    if (box2) {
      const pp = P(fut, h => h.pop);
      if (pp.length) paint(box2, {
        w, h: 150, t0, t1, tz, yMin: 0, yMax: 100, yStep: 20, yFmt: pctFmt, now: nowIn, past: [], fut: pp, color: '#5AC8FA', area: true,
        scrub: { head: 'c2head', mode: 'point', fmt: p => readout('compact', fmtClock(p.t, tz), '', '', Math.round(p.v) + '%', 'Chance of precipitation') },
      });
      else box2.innerHTML = '';
    }
  } else if (state.metric === 'precip') {
    const pp = P(fut, h => h.pop);
    if (pp.length) paint(box1, {
      w, h: 170, t0, t1, tz, yMin: 0, yMax: 100, yStep: 20, yFmt: pctFmt, now: nowIn, past: [], fut: pp, color: '#5AC8FA', area: true,
      scrub: { head: 'dhead', mode: 'point', fmt: p => readout('compact', fmtClock(p.t, tz), '', '', Math.round(p.v) + '%', 'Chance of precipitation') },
    });
    else box1.innerHTML = '<div class="sub">No hourly data for this day yet.</div>';
    const qp = P(fut, h => precipDisp(h.qpf));
    const mx = Math.max(0, ...qp.map(p => p.v));
    const step = metric() ? (mx > 4 ? 2 : mx > 2 ? 1 : 0.5) : (mx > 0.2 ? 0.1 : mx > 0.1 ? 0.05 : 0.02);

      const next = cat === 'rain' || cat === 'storm' ? 'rain' : cat === 'snow' ? 'snow' : (!isDay && (cat === 'clear' || cat === 'partly')) ? 'stars' : 'none';
      if (next !== mode) { mode = next; start(); }
    },
  };
})();

/* ============================== events ============================== */
function select(id) {
  state.selected = id; store.set('selected', id); state.day = null;
  $('daySheet').hidden = true; $('placesSheet').hidden = true;
  render(); window.scrollTo({ top: 0 });
  const p = selectedPlace();
  const m = state.models[p.id];
  if (!m || Date.now() - m.fetchedAt > REFRESH_MS) loadPlace(p);
}
function addPlace(r) {
  const id = (r.name + '-' + r.region).toLowerCase().replace(/[^a-z0-9]+/g, '-') + '-' + r.lat.toFixed(2) + ',' + r.lon.toFixed(2);
  if (!state.places.some(p => p.id === id)) { state.places.push({ id, name: r.name, region: r.region, lat: +r.lat.toFixed(4), lon: +r.lon.toFixed(4) }); store.set('places', state.places); }
  state.results = null; state.query = '';
  select(id);
}
let searchTimer = 0, searchSeq = 0;
document.addEventListener('input', e => {
  const t = e.target;
  if (!t.id || !t.id.startsWith('q-')) return;
  state.query = t.value;
  clearTimeout(searchTimer);
  if (t.value.trim().length < 2) { state.results = null; renderSidebar(); if (!$('placesSheet').hidden) renderPlacesSheet(); return; }
  searchTimer = setTimeout(async () => {
    const seq = ++searchSeq;
    try { const r = await searchPlaces(t.value); if (seq === searchSeq) state.results = r; }
    catch (err) { if (seq === searchSeq) state.results = []; }
    renderSidebar(); if (!$('placesSheet').hidden) renderPlacesSheet();
  }, 260);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (scrub) { endScrub(); return; }
    if (!$('daySheet').hidden) { state.day = null; $('daySheet').hidden = true; return; }
    if (!$('placesSheet').hidden) { $('placesSheet').hidden = true; return; }
  }
  const box = document.activeElement && document.activeElement.closest && document.activeElement.closest('.chartbox[data-scrub]');
  if (box && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
    e.preventDefault();
    const en = SCRUB.get(box.dataset.scrub);
    const from = scrub && scrub.box === box ? scrub.t : (en && en.t0 <= Date.now() && Date.now() <= en.t1 ? Date.now() : en ? en.t0 : 0);
    scrubTo(box, from + (e.key === 'ArrowLeft' ? -HOUR : HOUR) * (scrub && scrub.box === box ? 1 : 0));
    return;
  }
  if (!$('daySheet').hidden && (e.key === 'ArrowLeft' || e.key === 'ArrowRight') && !(e.target && e.target.tagName === 'INPUT')) {
    stepDay(e.key === 'ArrowLeft' ? -1 : 1);
  }
  if (e.key === 'Enter' && e.target && e.target.id && e.target.id.startsWith('q-') && state.results && state.results[0]) addPlace(state.results[0]);
});
function stepDay(n) {
  const m = viewModel(state.models[state.selected]); if (!m) return;
  const dates = m.daily.map(d => d.date), i = dates.indexOf(state.day) + n;
  if (i >= 0 && i < dates.length) { state.day = dates[i]; renderDaySheet(); }
}
document.addEventListener('click', e => {
  const el = e.target.closest('button, [data-close]');
  if (e.target === $('daySheet')) { state.day = null; $('daySheet').hidden = true; return; }
  if (e.target === $('placesSheet')) { $('placesSheet').hidden = true; return; }
  if (!el) return;
  const d = el.dataset;
  if (d.del) {
    state.places = state.places.filter(p => p.id !== d.del); store.set('places', state.places); store.del('model:' + d.del); store.del('ext:' + d.del);
    if (state.selected === d.del) state.selected = state.places[0].id;
    store.set('selected', state.selected); render(); return;
  }
  if (d.place) { if (!state.editing) select(d.place); return; }
  if (d.result != null && state.results) { addPlace(state.results[+d.result]); return; }
  if ('edit' in d) { state.editing = !state.editing; render(); return; }
  if ('here' in d) { locate(el); return; }
  if (d.units) { state.units = d.units; store.set('units', d.units); render(); return; }
  if ('refresh' in d) { loadPlace(selectedPlace(), { force: true }); return; }
  if ('openPlaces' in d) { renderPlacesSheet(); $('placesSheet').hidden = false; return; }
  if ('close' in d) { state.day = null; $('daySheet').hidden = true; $('placesSheet').hidden = true; return; }
  if (d.day) { state.day = d.day; state.metric = state.metric || 'conditions'; renderDaySheet(); const p = $('daySheet').querySelector('.panel'); if (p) p.scrollTop = 0; return; }
  if (d.goto) { state.day = d.goto; renderDaySheet(); return; }
  if (d.step) { stepDay(+d.step); return; }
  if (d.metric) { state.metric = d.metric; renderDaySheet(); return; }
  if (d.feels != null) { state.feels = d.feels === '1'; renderDaySheet(); return; }
  if (d.alert) { state.openAlert = state.openAlert === d.alert ? null : d.alert; renderMain(); return; }
  if ('afd' in d) { state.afdOpen = !state.afdOpen; renderMain(); return; }
});
function locate(btn) {
  const old = btn.innerHTML;
  btn.textContent = 'Finding you…';
  navigator.geolocation.getCurrentPosition(pos => {
    const lat = +pos.coords.latitude.toFixed(4), lon = +pos.coords.longitude.toFixed(4);
    const existing = state.places.find(p => p.id === 'here');
    if (existing) { existing.lat = lat; existing.lon = lon; }
    else state.places.unshift({ id: 'here', name: 'My Location', region: '', lat, lon });
    store.set('places', state.places);
    delete state.models.here;
    select('here');
  }, err => {
    btn.innerHTML = old;
    const n = document.createElement('div');
    n.className = 'sb-foot';
    n.textContent = err && err.code === 1 ? 'Location permission was denied. Search for your city instead.' : 'Your location isn’t available right now. Search for your city instead.';
    btn.after(n);
  }, { enableHighAccuracy: false, timeout: 12000, maximumAge: 10 * 60e3 });
}
/* charts: hover with a mouse, drag with a finger */
const daySheetEl = $('daySheet');
daySheetEl.addEventListener('pointermove', scrubFromPointer);
daySheetEl.addEventListener('pointerdown', scrubFromPointer);
daySheetEl.addEventListener('pointerleave', () => endScrub());
daySheetEl.addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') endScrub(); });
daySheetEl.addEventListener('pointercancel', () => endScrub());
daySheetEl.addEventListener('focusout', e => { if (e.target && e.target.classList && e.target.classList.contains('chartbox')) endScrub(); });
/* while a sheet is open, the page behind it stays put */
const lockPage = () => {
  const open = !$('daySheet').hidden || !$('placesSheet').hidden;
  document.documentElement.classList.toggle('locked', open);
  if (!open) endScrub();
};
const lockObs = new MutationObserver(lockPage);
lockObs.observe($('daySheet'), { attributes: true, attributeFilter: ['hidden'] });
lockObs.observe($('placesSheet'), { attributes: true, attributeFilter: ['hidden'] });
let resizeT = 0;
window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (!$('daySheet').hidden) renderDaySheet(); }, 150); });
function maybeRefresh() {
  if (document.hidden) return;
  const p = selectedPlace(), m = state.models[p.id];
  if (!state.loading[p.id] && (!m || Date.now() - m.fetchedAt > REFRESH_MS)) loadPlace(p);
}
document.addEventListener('visibilitychange', maybeRefresh);
window.addEventListener('online', () => { for (const k of Object.keys(state.errors)) delete state.errors[k]; loadAll(); });
window.addEventListener('offline', () => render());
setInterval(() => { maybeRefresh(); const m = state.models[state.selected]; if (m && !document.hidden) { renderBar(); renderSidebar(); } }, 60e3);

render();
loadAll();

/* When served from a web address (your own computer, Netlify...), save the app on the device
   so the home-screen icon still opens if that computer is asleep. Skipped when opened as a file. */
if (/^https?:$/.test(location.protocol)) {
  const link = document.createElement('link');
  link.rel = 'manifest'; link.href = 'manifest.json';
  document.head.appendChild(link);
  if ('serviceWorker' in navigator && window.isSecureContext) navigator.serviceWorker.register('sw.js').catch(() => {});
}
})();
</script>
</body>
</html>
